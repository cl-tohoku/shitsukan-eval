[project]
name = "shitsukan-eval"
version = "0.1.0"
description = "Evaluating Model (LLM / LVLM) Alignment with Human Perception"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch ==2.4.0+cu121; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "torch ==2.4.0; sys_platform == 'darwin' or (sys_platform == 'linux' and platform_machine == 'aarch64')",
    "torchvision ==0.19.0+cu121; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "torchvision ==0.19.0; sys_platform == 'darwin' or (sys_platform == 'linux' and platform_machine == 'aarch64')",
    "numpy <2.0.0",
    "matplotlib >=3.9.1",
    "seaborn >=0.13.2",
    "plotly >=5.22.0",
    "pandas >=2.2.2",
    "polars >=1.1.0",
    "scikit-learn >=1.5.1",
    "scipy >=1.14.0",
    "pillow >=10.4.0",
    "sentencepiece >=0.2.0",
    "nltk >=3.8.1",
    "spacy >=3.7.5",
    "tqdm >=4.66.4",
    "wandb >=0.17.4",
    "torchinfo >=1.8.0",
    "torchviz >=0.0.2",
    # Pinned to the release closest to the experiments of the paper (autumn 2024).
    # 4.46.0 is the first release with Idefics3; transformers 5 removed
    # AutoModelForVision2Seq, which the Idefics3 wrapper imports.
    "transformers ==4.46.0",
    "openai >=1.35.14",
    "datasets >=2.20.0",
    "evaluate >=0.4.2",
    "timm >=1.0.7",
    "accelerate >=0.32.1; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "peft >=0.11.1; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "appdirs >=1.4.4",
    "loralib >=0.1.2",
    "py7zr >=0.21.1",
    "bitsandbytes >=0.43.1; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "hatchling >=1.22.5",
    "editables >=0.5",
    "wheel >=0.44.0",
    "jsonargparse>=4.32.1",
    "loguru>=0.7.2",
    "eval-type-backport>=0.2.0",
    "smart-open>=7.0.4",
    "rich>=13.9.3",
    "tiktoken>=0.7.0",
    "tabulate>=0.9.0",
    "vllm >=0.6.3; sys_platform == 'linux' and platform_machine == 'x86_64'",
    # Resizes the images for Qwen2-VL with vLLM; 0.0.8 was current from 2024-09 to 2025-01.
    "qwen-vl-utils ==0.0.8; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "mistral-common >=1.4.4; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "opencv-contrib-python>=4.10.0.84",
]

# Development tools, installed by `uv sync` (skip them with `uv sync --no-dev`).
# flash-attn is listed here as in the original setup; when it is installed, the
# Hugging Face wrappers default to attn_implementation="flash_attention_2".
# 2.6.3 was the latest release until 2024-11-12. It is installed from a prebuilt
# wheel for CPython 3.11 (see [tool.uv.sources]).
[dependency-groups]
dev = [
    "flash-attn ==2.6.3; sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.11'",
    "jupyterlab>=4.2.5",
    "pre-commit>=4.0.0",
    "pytest>=8.3.0",
    "pytest-mock>=3.14.0",
    # Keep in sync with the revisions in .pre-commit-config.yaml.
    "ruff==0.17.1",
    "ty==0.0.89",
]

[tool.uv]
find-links = [
    "https://download.pytorch.org/whl/cu121/torch",
    "https://download.pytorch.org/whl/cu121/torchvision",
]

# PyPI has only the source distribution of flash-attn. Its setup.py imports torch
# without declaring it as a build dependency, so the isolated build that uv runs
# to read the metadata fails, and uv needs that metadata even to lock the project
# (`uv sync --no-dev` failed as well). Use the wheel that this setup.py downloads
# for torch 2.4, CUDA 12, and CPython 3.11 instead; nothing is built.
[tool.uv.sources]
flash-attn = { url = "https://github.com/Dao-AILab/flash-attention/releases/download/v2.6.3/flash_attn-2.6.3+cu123torch2.4cxx11abiFALSE-cp311-cp311-linux_x86_64.whl" }

[tool.ruff]
exclude = [".git", ".mypy_cache", ".ruff_cache", ".venv", "third_party"]
line-length = 160
target-version = "py311"

[tool.ruff.lint]
fixable = ["ALL"]
unfixable = []
select = [
    "A",  # flake8-builtin
    "B",  # flake8-bugbear
    "D",  # pydocstyle (docstring format, see [tool.ruff.lint.pydocstyle])
    "E",  # pycodestyle error
    "F",  # Pyflakes
    "I",  # isort
    "N",  # pep8-naming
    "W",  # pycodestyle warning
    "PL",  # Pylint
    "UP",  # pyupgrade
]
ignore = [
    "B905",  # Zip-without-explicit-strict
    "E501",  # Line too long, handled by the formatter
    "N812",  # Lowercase imported as non-lowercase
    "N999",  # Invalid module name
    "UP035",  # Checks for uses of deprecated imports based on the minimum supported Python version.
    "PLR0912",  # Too many branches
    "PLR0913",  # Too many arguments in function definition
    "PLR0915",  # Too many statements in function
    "PLR0917",  # Too many positional arguments (the wrappers and tasks keep their positional signatures)
    "PLR2004",  # Magic value used in comparison
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Test names describe the behavior under test, so test functions need no docstrings.
"tests/**" = ["D103"]

[tool.ruff.format]
quote-style = "double"
line-ending = "auto"

[tool.ty.environment]
python-version = "3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = ["--strict-markers"]
