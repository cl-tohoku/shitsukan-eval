# Checks run before every commit after `uv run pre-commit install`.
# Run them on the whole repository with `uv run pre-commit run --all-files`.
default_install_hook_types: [pre-commit]
default_stages: [pre-commit]
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Keep in sync with the ruff version in pyproject.toml.
    rev: v0.17.1
    hooks:
      # Lint, including the Google-style docstring rules, and apply safe fixes.
      - id: ruff-check
        args: [--fix]
      # Format Python files (and Python code blocks in Markdown).
      - id: ruff-format

  - repo: https://github.com/astral-sh/ty-pre-commit
    # Keep in sync with the ty version in pyproject.toml.
    rev: v0.0.89
    hooks:
      # Type-check the whole project in the uv-managed environment (`uv check`).
      # --frozen installs the versions recorded in uv.lock and never re-resolves
      # dependencies during a commit; run `uv sync` once to create uv.lock.
      - id: ty
        args: [--frozen]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      # Detect hard-coded secrets, such as API keys, in the staged changes.
      - id: gitleaks
